[package]
name = "tmt"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Host tool for ospab.os .tmt packages and the tmt.ospab.org repository"

# Standalone: not a member of the kernel or user workspaces.
[workspace]

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
opt-level = 2
lto = true
strip = true
