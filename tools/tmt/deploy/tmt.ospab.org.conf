# nginx server block for the official ospab.os package repository.
# Layout on the server:  /var/www/tmt.ospab.org/x86_64/{index,index.sig,*.tmt}
# Install:  cp to /etc/nginx/sites-available/, ln -s into sites-enabled/, then
#           sudo certbot --nginx -d tmt.ospab.org   (adds the 443 block and certificates)

server {
    listen 80;
    listen [::]:80;
    server_name tmt.ospab.org;
    root /var/www/tmt.ospab.org;

    autoindex off;
    default_type application/octet-stream;
    types { text/plain index; application/octet-stream tmt sig; }

    # The index and its signature must always be fresh: clients verify the pair together.
    location ~ ^/[^/]+/index(\.sig)?$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # Packages are immutable (name-version.tmt): cache hard.
    location ~ \.tmt$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / { try_files $uri =404; }
}
# NOTE: tomato's TLS client wants a normal certificate chain from certbot (Let's Encrypt).
# Redirects are followed by tomato, so certbot's http->https redirect is fine.
