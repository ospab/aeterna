timeout: 5
serial: yes
wallpaper: no
interface_resolution: max
resolution: max

/ospab.os Live
    protocol: limine
    kernel_path: boot():/boot/KERNEL
    cmdline: mode=live
    resolution: max
    module_path: boot():/boot/KERNEL
    module_cmdline: kernel
    module_path: boot():/EFI/OSPAB/OSPABLDR.EFI
    module_cmdline: efi

/ospab.os Desktop
    protocol: limine
    kernel_path: boot():/boot/KERNEL
    cmdline: mode=live session=desktop
    resolution: max
    module_path: boot():/boot/KERNEL
    module_cmdline: kernel
    module_path: boot():/EFI/OSPAB/OSPABLDR.EFI
    module_cmdline: efi

/ospab.os Installer
    protocol: limine
    kernel_path: boot():/boot/KERNEL
    cmdline: mode=installer
    resolution: max
    module_path: boot():/boot/KERNEL
    module_cmdline: kernel
    module_path: boot():/EFI/OSPAB/OSPABLDR.EFI
    module_cmdline: efi

/ospab.os Live (ospab loader, test)
    protocol: efi
    path: boot():/EFI/OSPAB/OSPABLDR.EFI
