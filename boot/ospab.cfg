# ospab.os loader configuration, format version 1 (docs/en/boot.md).
# Live medium: the entries that need the loader and the kernel as modules
# (the installer copies them to the target disk).
version = 1

[global]
timeout = 5
default = live
remember_last = yes
resolution = auto
serial = no
theme = dark

[entry live]
title = ospab.os Live
type = ospab
kernel = /boot/KERNEL
cmdline = mode=live
module = /boot/KERNEL kernel
module = /EFI/OSPAB/OSPABLDR.EFI efi

[entry desktop]
title = ospab.os Desktop
type = ospab
kernel = /boot/KERNEL
cmdline = mode=live session=desktop
module = /boot/KERNEL kernel
module = /EFI/OSPAB/OSPABLDR.EFI efi

[entry installer]
title = ospab.os Installer
type = ospab
kernel = /boot/KERNEL
cmdline = mode=installer
module = /boot/KERNEL kernel
module = /EFI/OSPAB/OSPABLDR.EFI efi

[entry debug]
title = ospab.os (debug)
type = ospab
kernel = /boot/KERNEL
cmdline = mode=live debug=1 selftest=ipc persist=ro
module = /boot/KERNEL kernel
module = /EFI/OSPAB/OSPABLDR.EFI efi

[entry memtest]
title = Memory test
type = memtest
cmdline = passes=1

[entry firmware]
title = Firmware settings
type = firmware

[entry reboot]
title = Reboot
type = reboot

[entry poweroff]
title = Power off
type = poweroff
