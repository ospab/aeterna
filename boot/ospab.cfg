# ospab.os loader configuration (boot/uefi, read from /boot/ospab.cfg).
# Mirrors limine.conf. Paths are from the root of the boot volume.
timeout=3
default=1
resolution=auto

entry=ospab.os Live
    kernel=/boot/KERNEL
    cmdline=mode=live
    module=/boot/KERNEL kernel
    module=/EFI/OSPAB/OSPABLDR.EFI efi

entry=ospab.os Installer
    kernel=/boot/KERNEL
    cmdline=mode=installer
    module=/boot/KERNEL kernel
    module=/EFI/OSPAB/OSPABLDR.EFI efi
