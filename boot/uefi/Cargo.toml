[package]
name = "ospab_boot"
version = "0.1.0"
license = "AGPL-3.0-only"
authors = ["ospab "]
edition = "2021"
description = "ospab-boot UEFI front-end (the BIOS front-end is boot/bios)"

# Standalone: not a member of the kernel package.
[workspace]

[[bin]]
name = "ospab_boot"
path = "src/main.rs"
test = false
bench = false

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
