[package]
name = "ospab_os"
version = "1.1.0"
license = "AGPL-3.0-only"
authors = ["ospab "]
edition = "2021"

[dependencies]
# Базовые структуры данных без стандартной библиотеки
volatile = "0.6.1"
spin = "0.10.0"
bitflags = "2.4"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
linked_list_allocator = "0.10"

# Для будущего парсинга конфигов ИИ
crossbeam-utils = { version = "0.8", default-features = false }

# OSTP protocol core (no_std + alloc; branch no-std-core of the ostp repo)
ostp-core = { git = "https://github.com/ospab/ostp", branch = "no-std-core", default-features = false }

# tomato: verify the Ed25519 signature of the tmt.ospab.org package index (no_std)
ed25519-dalek = { version = "2", default-features = false }

# oos-ui: software UI toolkit (gui/), used by the guidemo command
oos-ui = { path = "gui" }

[profile.release]
panic = "abort"
lto = true          # Максимальная оптимизация для ИИ