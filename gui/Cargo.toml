[package]
name = "oos-ui"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["ospab"]
description = "ospab.os UI toolkit: software rendering, text, theme, widgets (no_std + alloc)"

[lib]
name = "oos_ui"
path = "src/lib.rs"

[features]
default = ["embedded-fonts"]
# Bundle Inter + JetBrains Mono subsets (about 140 KiB) via include_bytes!.
embedded-fonts = []
# Host-only: tests, PNG mockup tools.
std = []

[dependencies]
fontdue = { version = "0.9.4", default-features = false, features = ["hashbrown", "simd"] }
ttf-parser = { version = "0.25", default-features = false, features = ["opentype-layout", "no-std-float"] }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }

[dev-dependencies]
png = "0.18"

[[example]]
name = "mockups"
required-features = ["std"]

[profile.release]
opt-level = 3
debug = false
