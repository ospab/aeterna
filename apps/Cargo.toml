# Program SDK workspace for ospab.os: small ring-3 programs built against ../user/liboos.
# Separate from the kernel crate and from ../user (the OS's own bundled programs).
[workspace]
members = ["hello-tmt", "cowsay", "calc", "hello-gui", "olang", "gfxtest", "beeb-core", "beeb"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "0.1.0"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"
