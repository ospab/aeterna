[build]
target = "../user/x86_64-unknown-oos.json"

[target.x86_64-unknown-oos]
# rustc runs with apps/ as its working directory, so this path is relative to apps/.
rustflags = ["-C", "link-arg=-T../user/link.ld"]

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
